[serve]
max_agents = 4
poll_interval_secs = 30
state_path = "styrir-state.json"

# Commands are argv arrays (never shell snippets). A queue command must write a
# JSON array to stdout. Each mapped command receives one compact JSON item on stdin.
[[queue]]
name = "skald-building"
command = ["skald", "list", "--status", "building", "--json"]

# Stages run in order for each ticket. This adapter writes JSON such as
# {"path":"/workspaces/ticket"}; Styrir stores it as `workspace`.
[[dispatch]]
queue = "skald-building"
command = ["heimr-dispatch"]
stdin = "item"
capture = "workspace"
capture_format = "json"

[[dispatch]]
queue = "skald-building"
command = ["gardr", "run", "start", "--workspace", "{{ workspace.path }}"]
stdin = "none"
